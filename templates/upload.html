<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload de Arquivos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h4 class="mb-4">Upload de Arquivos</h4>

                        <form
                            id="form-upload"
                            action="{{ url_for('upload.enviar') }}"
                            method="post"
                            enctype="multipart/form-data"
                        >

                            <div class="mb-3">
                                <label for="arquivo" class="form-label">
                                    Selecione o arquivo
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="arquivo"
                                    name="arquivo"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="btn-enviar"
                                style="display: none;"
                            >
                                Enviar
                            </button>

                            <a href="{{ url_for('home.menu') }}" class="btn btn-secondary">
                                Voltar
                            </a>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        const arquivo = document.getElementById("arquivo");
        const botaoEnviar = document.getElementById("btn-enviar");
        const formulario = document.getElementById("form-upload");

        arquivo.addEventListener("change", function () {
            if (arquivo.files.length > 0) {
                botaoEnviar.style.display = "inline-block";
            } else {
                botaoEnviar.style.display = "none";
            }
        });

        formulario.addEventListener("submit", function () {
            botaoEnviar.style.display = "none";
        });
    </script>

</body>

</html>
